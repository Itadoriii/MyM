<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styleadmin.css">
    <!-- BOX ICONS -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <title>Admin · Maderas MyM</title>
</head>
<body>
    <div class="menu-dashboard">
        <!-- TOP MENU -->
        <div class="top-menu">
            <div class="logo">
                <img src="./assets/logo act.png" alt="Maderas MyM">
                <span>Maderas MyM</span>
            </div>
            <div class="toggle" title="Abrir/cerrar menú">
                <i class='bx bx-menu'></i>
            </div>
        </div>
        <!-- MENU -->
        <div class="menu">
            <div class="enlace" data-content="usuarios" title="Usuarios">
                <i class="bx bx-user"></i>
                <span>Usuarios</span>
            </div>

            <div class="enlace active" data-content="productos" title="Productos">
                <i class="bx bx-package"></i>
                <span>Productos</span>
            </div>

            <div class="enlace" data-content="pedidos" title="Pedidos">
                <i class="bx bx-cart"></i>
                <span>Pedidos</span>
            </div>
            <div class="enlace" data-content="trabajadores" title="Trabajadores">
                <i class="bx bx-group"></i>
                <span>Trabajadores</span>
            </div>
            <div class="enlace" data-content="adelantos" title="Adelantos">
                <i class="bx bx-money"></i>
                <span>Adelantos</span>
            </div>
            <div class="enlace" data-content="informe general" title="Informe General">
                <i class="bx bx-file"></i>
                <span>Informe General</span>
            </div>
            <button class="button enlace" title="Cerrar sesión">
                <i class='bx bx-log-out'></i>
                <span>Cerrar sesión</span>
            </button>
        </div>

    </div>
    <main id="main-content">
        <!-- Aquí se cargará el contenido dinámico de productos -->
        <input type="text" id="search-input" placeholder="Buscar producto...">
        <!-- Los productos se cargarán aquí -->
    </main>
    
   
    
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>


    <script src="admin.js"></script>
    


</body>
</html>
