<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maderas M&M - Login</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="stylelr.css" />
</head>
<body>
  <main>
    <div class="form-container">
      <a href="/" class="auth-logo-link" aria-label="Volver al inicio">
        <img src="assets/mymlog.png" alt="Maderas MyM" class="auth-logo">
      </a>
      <h1>Iniciar sesión</h1>
      <p>¡Ingresa a tu cuenta!</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="user">Usuario</label>
          <input type="text" name="user" id="user" placeholder="Tu nombre de usuario" required autocomplete="username">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" name="password" id="password" placeholder="Tu contraseña" required autocomplete="current-password">
          <p class="forgot-link"><a id="forgot-link" href="/forgot-password">¿Olvidaste tu contraseña?</a></p>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>

      <!-- Login con Google. El backend (/auth/google) siempre existió; el botón
           se había borrado de este archivo sin querer, por eso "quedó
           desconectado". -->
      <div class="auth-sep"><span>o</span></div>
      <a class="btn-google" href="/auth/google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Continuar con Google</span>
      </a>

      <!-- cuadro de mensaje -->
      <p id="msg" class="escondido"></p>
      <div id="actions" class="inline-actions escondido">
        <button id="btn-resend" class="linklike" type="button">Reenviar verificación</button>
      </div>

      <p>¿Todavía no tienes una cuenta? <a href="/register">Regístrate</a></p>
    </div>

    <p class="back-link"><a href="/">← Volver a la tienda</a></p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const msg  = document.getElementById('msg');
    const actions = document.getElementById('actions');
    const btnResend = document.getElementById('btn-resend');
    const forgotLink = document.getElementById('forgot-link');

    function showMsg(text, kind='error') {
      msg.textContent = text;
      msg.className = ''; // limpia
      msg.classList.add(kind === 'ok' ? 'ok' : 'error');
    }
    function hideMsg() {
      msg.textContent = '';
      msg.className = 'escondido';
    }
    function showResend(show) {
      actions.className = show ? 'inline-actions' : 'inline-actions escondido';
    }

    const submitBtn = form.querySelector('button[type="submit"]');

    // Avisos que llegan por querystring (?verified=1 tras verificar, ?reset=1 tras cambiar la clave)
    const qs = new URLSearchParams(location.search);
    if (qs.get('reset') === '1') {
      showMsg('Contraseña actualizada. Ya puedes iniciar sesión.', 'ok');
    } else if (qs.get('verified') === '1') {
      showMsg('Correo verificado. Ya puedes iniciar sesión.', 'ok');
    } else if (qs.get('google') === 'error') {
      showMsg('No se pudo iniciar sesión con Google. Usa tu usuario y contraseña o inténtalo de nuevo.');
    }

    // Arrastra lo que ya escribió el usuario al formulario de recuperación.
    forgotLink.addEventListener('click', () => {
      const u = form.user.value.trim();
      forgotLink.href = u ? `/forgot-password?u=${encodeURIComponent(u)}` : '/forgot-password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      showResend(false);

      const user = form.user.value.trim();
      const password = form.password.value;

      if (!user || !password) {
        showMsg('Completa usuario y contraseña');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          // Caso especial: no verificado
          if (res.status === 403 && data.code === 'EMAIL_NOT_VERIFIED') {
            showMsg('Tu cuenta no está verificada. Revisa tu correo o reenvía el enlace.', 'error');
            showResend(true);
            return;
          }
          // Otros errores (credenciales, etc.)
          showMsg(data.message || 'Error al iniciar sesión');
          return;
        }

        // OK → redirigir
        showMsg('Login correcto. Redirigiendo...', 'ok');
        if (data.redirect) {
          location.href = data.redirect;
        } else {
          location.reload();
        }
      } catch (err) {
        console.error('[LOGIN] error', err);
        showMsg('No se pudo conectar con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });

    // Reenviar verificación (pide email)
    btnResend.addEventListener('click', async () => {
      const email = prompt('Ingresa tu correo para reenviar verificación:');
      if (!email) return;
      showMsg('Enviando verificación...', 'ok');
      try {
        const res = await fetch('/api/verify/resend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          if (data.alreadyVerified) {
            showMsg('Tu correo ya estaba verificado. Intenta iniciar sesión.', 'ok');
          } else {
            showMsg('Listo. Revisa tu correo (o carpeta de spam).', 'ok');
          }
        } else {
          showMsg('No se pudo reenviar. Intenta más tarde.');
        }
      } catch (e) {
        console.error('[RESEND] error', e);
        showMsg('No se pudo reenviar. Intenta más tarde.');
      }
    });
  </script>

    </script>
</body>
</html>
