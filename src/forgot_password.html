<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maderas M&M - Recuperar contraseña</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/stylelr.css" />
</head>
<body>
  <main>
    <div class="form-container">
      <a href="/" class="auth-logo-link" aria-label="Volver al inicio">
        <img src="/assets/mymlog.png" alt="Maderas MyM" class="auth-logo">
      </a>
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Te enviaremos un enlace para crear una nueva.</p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="identificador">Correo o nombre de usuario</label>
          <input type="text" name="identificador" id="identificador"
                 placeholder="tu@correo.com" required autocomplete="username">
          <div class="hint">El enlace llega al correo con el que te registraste.</div>
        </div>

        <button type="submit">Enviar enlace</button>
      </form>

      <p id="msg" class="escondido"></p>

      <p><a href="/login">Volver a iniciar sesión</a></p>
    </div>

    <p class="back-link"><a href="/">← Volver a la tienda</a></p>
  </main>

  <script>
    const form   = document.getElementById('forgot-form');
    const campo  = document.getElementById('identificador');
    const msg    = document.getElementById('msg');
    const submitBtn = form.querySelector('button[type="submit"]');

    function showMsg(text, kind='error') {
      msg.textContent = text;
      msg.className = '';
      msg.classList.add(kind === 'ok' ? 'ok' : 'error');
    }
    function hideMsg() {
      msg.textContent = '';
      msg.className = 'escondido';
    }

    // Si venía desde el login con el usuario escrito, lo precargamos.
    const previo = new URLSearchParams(location.search).get('u');
    if (previo) campo.value = previo;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();

      const identificador = campo.value.trim();
      if (!identificador) {
        campo.classList.add('invalid');
        showMsg('Ingresa tu correo o nombre de usuario.');
        return;
      }
      campo.classList.remove('invalid');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/password/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identificador })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMsg(data.message || 'No se pudo enviar el enlace. Intenta más tarde.');
          return;
        }

        showMsg('Si la cuenta existe, te enviamos un enlace. Revisa tu correo (también spam/promociones).', 'ok');
        form.reset();
      } catch (err) {
        console.error('[FORGOT] error', err);
        showMsg('No se pudo conectar con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar enlace';
      }
    });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X63BMSG51V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-X63BMSG51V');
  </script>
</body>
</html>
