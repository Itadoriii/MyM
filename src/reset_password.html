<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maderas M&M - Nueva contraseña</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/stylelr.css" />
</head>
<body>
  <main>
    <div class="form-container">
      <a href="/" class="auth-logo-link" aria-label="Volver al inicio">
        <img src="/assets/mymlog.png" alt="Maderas MyM" class="auth-logo">
      </a>
      <h1>Nueva contraseña</h1>
      <p id="subtitulo">Validando el enlace...</p>

      <form id="reset-form" class="escondido" novalidate>
        <div class="field">
          <label for="password">Nueva contraseña</label>
          <input type="password" name="password" id="password" placeholder="Nueva contraseña"
                 required autocomplete="new-password" minlength="8"
                 pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$">
          <div class="hint">Mínimo 8 caracteres, con mayúscula, minúscula y número.</div>
        </div>

        <div class="field">
          <label for="password2">Repetir contraseña</label>
          <input type="password" name="password2" id="password2" placeholder="Repite la contraseña"
                 required autocomplete="new-password">
        </div>

        <button type="submit">Guardar contraseña</button>
      </form>

      <p id="msg" class="escondido"></p>

      <p id="link-nuevo" class="escondido"><a href="/forgot-password">Solicitar un enlace nuevo</a></p>
      <p><a href="/login">Volver a iniciar sesión</a></p>
    </div>

    <p class="back-link"><a href="/">← Volver a la tienda</a></p>
  </main>

  <script>
    const form      = document.getElementById('reset-form');
    const pass      = document.getElementById('password');
    const pass2     = document.getElementById('password2');
    const msg       = document.getElementById('msg');
    const subtitulo = document.getElementById('subtitulo');
    const linkNuevo = document.getElementById('link-nuevo');
    const submitBtn = form.querySelector('button[type="submit"]');

    const passRe = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

    const params = new URLSearchParams(location.search);
    const uid    = params.get('uid') || '';
    const token  = params.get('token') || '';

    function showMsg(text, kind='error') {
      msg.textContent = text;
      msg.className = '';
      msg.classList.add(kind === 'ok' ? 'ok' : 'error');
    }
    function hideMsg() {
      msg.textContent = '';
      msg.className = 'escondido';
    }
    function mostrarFormulario(mostrar) {
      form.className = mostrar ? '' : 'escondido';
    }
    function enlaceInvalido() {
      subtitulo.textContent = 'Este enlace no es válido o ya expiró.';
      mostrarFormulario(false);
      linkNuevo.className = '';
      showMsg('Los enlaces duran 60 minutos y solo pueden usarse una vez.');
    }

    // Valida el enlace antes de mostrar el formulario.
    (async () => {
      if (!uid || !token) return enlaceInvalido();

      try {
        const res = await fetch(`/api/password/reset/check?uid=${encodeURIComponent(uid)}&token=${encodeURIComponent(token)}`);
        const data = await res.json().catch(() => ({}));

        if (data.code === 'SERVER_ERROR') {
          subtitulo.textContent = 'No se pudo validar el enlace.';
          showMsg('Hubo un problema en el servidor. Vuelve a intentarlo en unos minutos.');
          return;
        }
        if (!res.ok || !data.ok) return enlaceInvalido();

        subtitulo.textContent = `Define una contraseña nueva para la cuenta ${data.user || ''}.`;
        mostrarFormulario(true);
        pass.focus();
      } catch (err) {
        console.error('[RESET] error validando', err);
        subtitulo.textContent = 'No se pudo validar el enlace.';
        showMsg('No se pudo conectar con el servidor. Intenta recargar la página.');
      }
    })();

    pass2.addEventListener('input', () => {
      if (pass2.value && pass.value && pass2.value !== pass.value) {
        pass2.classList.add('invalid');
      } else {
        pass2.classList.remove('invalid');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      pass.classList.remove('invalid');
      pass2.classList.remove('invalid');

      if (!passRe.test(pass.value)) {
        pass.classList.add('invalid');
        showMsg('La contraseña debe tener mínimo 8 caracteres e incluir mayúscula, minúscula y número.');
        return;
      }
      if (pass.value !== pass2.value) {
        pass2.classList.add('invalid');
        showMsg('Las contraseñas no coinciden.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        const res = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, token, password: pass.value })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          if (data.code === 'INVALID_TOKEN') return enlaceInvalido();
          showMsg(data.message || 'No se pudo cambiar la contraseña.');
          return;
        }

        mostrarFormulario(false);
        subtitulo.textContent = '¡Listo!';
        showMsg('Tu contraseña fue actualizada. Redirigiendo al inicio de sesión...', 'ok');
        setTimeout(() => { location.href = data.redirect || '/login'; }, 2000);
      } catch (err) {
        console.error('[RESET] error', err);
        showMsg('No se pudo conectar con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar contraseña';
      }
    });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X63BMSG51V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-X63BMSG51V');
  </script>
</body>
</html>
